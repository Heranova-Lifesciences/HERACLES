{% set version = "0.1.0" %}

package:
  name: heracles
  version: "{{ version }}"

source:
  url: https://github.com/Heranova-Lifesciences/HERACLES/archive/v{{ version }}.tar.gz
  sha256: "PLACEHOLDER"

build:
  number: 0
  noarch: python
  entry_points:
    - heracles = main:main
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - pandas >=1.3.0
    - numpy >=1.21.0
    - biopython >=1.79
    - pydeseq2 >=0.4.0
    - networkx >=2.6
    - tqdm >=4.62.0
    - matplotlib-base >=3.4.0
    - seaborn-base >=0.11.0
    - multiqc >=1.12
    - gseapy >=1.0.0
    - trim-galore=0.6.10
    - bowtie
    - risearch2

test:
  imports:
    - modules
  commands:
    - heracles --help

about:
  home: https://github.com/Heranova-Lifesciences/HERACLES
  license: MIT
  license_file: LICENSE
  summary: "Integrated tsRNA analysis pipeline: QC → annotation → clustering → DESeq2 → target prediction"
