name: docker-build

# Builds the HERACLES image and runs the smoke test inside it.
# Runs on GitHub-hosted runners, so no Docker is needed on the author's machine.

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
      - main.py
      - modules/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: heracles:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -c, not -lc: a login shell re-sources /etc/profile and drops the
      # PATH the image sets, so every tool lookup fails.
      - name: Smoke test inside the image
        run: |
          docker run --rm --entrypoint bash heracles:ci -c \
            'echo "PATH=$PATH"; which bowtie cutadapt trim_galore || true; bash /opt/heracles/docker/smoke_test.sh'

      - name: Report tool versions
        run: |
          docker run --rm --entrypoint bash heracles:ci -c '
            echo "bowtie:      $(bowtie --version 2>&1 | head -1)"
            echo "cutadapt:    $(cutadapt --version)"
            echo "trim_galore: $(trim_galore --version 2>&1 | grep -i "version" | head -1)"
            echo "RIsearch2:   $(RIsearch2 2>&1 | grep -o "RIsearch v[0-9.]*" | head -1)"
            python -c "import pandas, numpy, Bio, networkx, matplotlib, seaborn, pydeseq2, gseapy; print(\"python deps: ok\")"
          '

      - name: Image size
        run: docker image ls heracles:ci
