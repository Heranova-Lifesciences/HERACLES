# HERACLES runtime environment.
# Every external tool is available from conda, so the same file is used for
# the Docker image and for a plain `conda env create -f environment.yml`.
#
# Every dependency is pinned to an exact version, so a rebuild reproduces the
# environment the manuscript was produced with. Bump a pin only together with a
# re-run of the affected stage.
name: heracles
channels:
  - conda-forge
  - bioconda
  - rthtools          # RIsearch 2.1 only; public channel on anaconda.org
dependencies:
  - python=3.10.14
  # external tools
  - bowtie=1.3.1
  - cutadapt=5.2
  - trim-galore=0.6.10
  - risearch=2.1
  # python libraries
  - numpy=1.26.4
  - pandas=2.2.3
  - biopython=1.84   # Bio.Align.PairwiseAligner / Alignment.aligned (needs >=1.80)
  - networkx=3.4.2
  - tqdm=4.67.1
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - multiqc=1.21
  - pip=24.0
  - pip:
      - pydeseq2==0.5.2
      - gseapy==1.2.1